# VirtualHost Apache — serveur local entreprise (HTTP LAN)
# Copier vers : /etc/apache2/sites-available/fouta.conf
# Adapter ServerName si l'IP change.

<VirtualHost *:80>
    ServerName 192.168.1.217
    ServerAlias fplserver fplserver.local

    DocumentRoot /var/www/fouta

    <Directory /var/www/fouta>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/fouta-error.log
    CustomLog ${APACHE_LOG_DIR}/fouta-access.log combined
</VirtualHost>
